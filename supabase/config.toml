# Supabase project configuration.
#
# ONLY the function declaration is here. There is no local database config
# because `database/fatclinic.sql` is the single source of truth for the schema
# and is applied over the connection pooler by `npm run db:apply` - not by
# `supabase db push`. Two competing schema paths is how a clinic ends up with a
# database nobody can explain.

project_id = "pltcaelohphezknpxpdj"

[functions.staff-accounts]
# The gateway rejects any request whose bearer token is not a valid Supabase
# JWT. This is the OUTER of two checks, not the only one: a valid token proves
# the caller signed in, not that they are an administrator, so the handler
# re-resolves the caller against public.users and requires an active
# ADMINISTRATOR row. Both layers are deliberate - the gateway one stops a
# stranger spending the privileged key, the handler one stops a clinician
# spending an administrator's session.
verify_jwt = true
